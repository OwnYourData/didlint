name: regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dri:
        description: "SOyA structure (DRI) to check; empty means the pinned structure"
        required: false
        default: ""
      encoding:
        description: "Encoding of set values; auto decides from the structure"
        required: false
        default: "auto"
        type: choice
        options: [auto, flat, list]

permissions:
  contents: read

jobs:
  structure:
    name: SOyA structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the fixtures against the structure
        env:
          DRI: ${{ inputs.dri }}
          ENCODING: ${{ inputs.encoding || 'auto' }}
        run: python3 script/check_fixtures.py --structure "$DRI" --encoding "$ENCODING"

  instance:
    name: Unit tests and container built from this commit, online and offline
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -f docker/Dockerfile -t didlint:ci .
      - name: Unit tests
        run: docker run --rm -e RAILS_ENV=test -e BUNDLE_WITHOUT= didlint:ci sh -c 'bundle install --quiet && bundle exec rspec'
      - name: Start the container
        run: |
          docker run -d --name didlint -p 3000:3000 \
            -e RAILS_ENV=production -e RAILS_LOG_TO_STDOUT=TRUE -e RAILS_SERVE_STATIC_FILES=TRUE \
            -e LANG=C.UTF-8 -e allowed_hosts=localhost -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            didlint:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/version && exit 0
            sleep 2
          done
          docker logs didlint
          exit 1
      - name: Run the fixtures
        run: python3 script/check_fixtures.py --url http://localhost:3000
      - name: Start the container in offline mode, in a network without internet access
        run: |
          docker network create --internal offline
          docker run -d --name didlint-offline --network offline \
            -e RAILS_ENV=production -e RAILS_LOG_TO_STDOUT=TRUE -e RAILS_SERVE_STATIC_FILES=TRUE \
            -e LANG=C.UTF-8 -e allowed_hosts=didlint-offline -e DIDLINT_OFFLINE=true \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            didlint:ci
      - name: Run the fixtures in offline mode from the same network
        run: |
          docker run --rm --network offline -v "$PWD:/src:ro" -w /src \
            python:3.13-alpine@sha256:83057c121ebd0ccd12511f81aeb7e3b36a36f81b9d0687f7b8fcc93935497768 \
            sh -c 'for i in $(seq 1 60); do wget -q -O /dev/null http://didlint-offline:3000/version && break; sleep 2; done; python3 script/check_fixtures.py --url http://didlint-offline:3000 --offline'
      - name: Container log
        if: failure()
        run: |
          docker logs didlint || true
          docker logs didlint-offline || true

  live:
    name: didlint.ownyourdata.eu
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the fixtures against the public instance
        run: python3 script/check_fixtures.py --url https://didlint.ownyourdata.eu
