# Start page: static files from frontend/, served by an unprivileged nginx.
# The ConfigMaps are generated by kustomization.yaml, so apply this directory
# with kubectl apply -k.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-resolver-frontend
  namespace: uniresolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uni-resolver-frontend
  template:
    metadata:
      labels:
        app: uni-resolver-frontend
    spec:
      containers:
      - name: uni-resolver-frontend
        image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: nginx
          mountPath: /etc/nginx/conf.d
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
      volumes:
      - name: site
        configMap:
          name: uni-resolver-frontend-site
      - name: nginx
        configMap:
          name: uni-resolver-frontend-nginx
---
kind: Service
apiVersion: v1
metadata:
  name: uni-resolver-frontend
  namespace: uniresolver
spec:
  selector:
    app: uni-resolver-frontend
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
