# Start page of https://uniresolver.ownyourdata.eu (the ingress sends /1.0 to
# uni-resolver-web and everything else here). Static files only; the page may
# load and call nothing but this host.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri =404;
    }
}
