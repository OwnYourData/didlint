        image: universalresolver/driver-did-key:latest@sha256:f046dfec52ba6cadbc17fedc48e90c65ff43c81a11fdcbf44bb8484de6fa6698
        ports:
        - containerPort: 8080
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 192Mi
---
kind: Service
apiVersion: v1
metadata:
  name: driver-did-key
  namespace: uniresolver
spec:
