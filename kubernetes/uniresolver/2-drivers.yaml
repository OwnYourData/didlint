# Drivers of the Universal Resolver in 1-uniresolver.yaml, one deployment and
# service each; the service names are the host names in application.yml.
# Images are pinned by digest; most are built for linux/amd64 only.
---
# did:ethr, did:web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uni-resolver-driver-did-uport
  namespace: uniresolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uni-resolver-driver-did-uport
  template:
    metadata:
      labels:
        app: uni-resolver-driver-did-uport
    spec:
      containers:
      - name: uni-resolver-driver-did-uport
        image: uport/uni-resolver-driver-did-uport:7.1.1@sha256:23b054d2513e0842b3f63bba1addfc1cb1f8bf3df6c24f229b57a6a18d911565
        ports:
        - containerPort: 8081
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 256Mi
---
kind: Service
apiVersion: v1
metadata:
  name: uni-resolver-driver-did-uport
  namespace: uniresolver
spec:
  selector:
    app: uni-resolver-driver-did-uport
  ports:
  - name: http
    protocol: TCP
    port: 8081
    targetPort: 8081
---
# did:key (Ed25519, X25519, secp256k1), did:jwk, did:pkh, did:tz
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-didkit
  namespace: uniresolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-didkit
  template:
    metadata:
      labels:
        app: driver-didkit
    spec:
      containers:
      - name: driver-didkit
        image: ghcr.io/spruceid/didkit-http:202402050910243f0642d@sha256:1ac79449f45c1d725dd8bf7ee64ff6be208f76cdba7b1fcb2deb25a6bb517932
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: HOST
          value: 0.0.0.0
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
---
kind: Service
apiVersion: v1
metadata:
  name: driver-didkit
  namespace: uniresolver
spec:
  selector:
    app: driver-didkit
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
---
