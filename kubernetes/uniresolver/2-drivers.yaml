# did:cid, through the Archon gatekeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-did-cid
  namespace: uniresolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-did-cid
  template:
    metadata:
      labels:
        app: driver-did-cid
    spec:
      containers:
      - name: driver-did-cid
        image: ghcr.io/archetech/uni-resolver-driver-did-cid:0.2.1@sha256:4131f6fd21fbdf834a0713e88820e2e904465a1e19d141a5f393e27f7f273025
        ports:
        - containerPort: 4250
        env:
        - name: ARCHON_GATEKEEPER_URL
          value: https://archon.technology
        readinessProbe:
          tcpSocket:
            port: 4250
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 192Mi
---
kind: Service
apiVersion: v1
metadata:
  name: driver-did-cid
  namespace: uniresolver
spec:
  selector:
    app: driver-did-cid
  ports:
  - name: http
    protocol: TCP
    port: 4250
    targetPort: 4250
---
# did:webplus; its SQLite store of verified DID documents is a cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-did-webplus
  namespace: uniresolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-did-webplus
  template:
    metadata:
      labels:
        app: driver-did-webplus
    spec:
      containers:
      - name: driver-did-webplus
        image: ghcr.io/ledgerdomain/did-webplus-urd:v0.7.0@sha256:f3c60a2a74eb6725df2a73d8ca2c63f261ecc370272fac94e3b10c8e7be9d367
        ports:
        - containerPort: 80
        env:
        - name: DID_WEBPLUS_URD_DATABASE_URL
          value: "sqlite:///data/did-webplus.db?mode=rwc"
        - name: DID_WEBPLUS_URD_LISTEN_PORT
          value: "80"
        - name: RUST_LOG
          value: "did_webplus=info,tower_http::trace=warn,info"
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
      volumes:
      - name: data
        emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: driver-did-webplus
  namespace: uniresolver
spec:
  selector:
    app: driver-did-webplus
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
